global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend react_frontend
    bind *:80
    mode http
    default_backend react_servers

backend react_servers
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web-01 192.168.56.20:3000 check
    server web-02 192.168.56.21:3000 check